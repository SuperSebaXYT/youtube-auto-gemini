name: Validate Cosmic Curious Code

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install requests pyyaml python-dotenv openai
      - name: Compile all Python files
        run: python -m compileall -q src tests
      - name: Run offline agent checks
        run: python -m src.agents.test_offline
      - name: Run Wikimedia license tests
        run: python -m unittest discover -s tests -v
