name: Daily Upload Pipeline

# Prevent overlapping runs from reading the same schedule state and uploading
# the same overdue slot concurrently. Queued runs are allowed to finish.
concurrency:
  group: cosmic-curious-publishing
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Run a single channel manually (leave blank for scheduler)"
        required: false
      force_run:
        description: "Run Cosmic Curious immediately, bypassing scheduler slot limits"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (build video, skip upload)?"
        type: boolean
        default: false

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install static FFmpeg
        run: |
          archive="$RUNNER_TEMP/ffmpeg-static.tar.xz"
          install_dir="$RUNNER_TEMP/ffmpeg-static"
          mkdir -p "$install_dir"

          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 180 \
            -o "$archive" \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz

          tar -xJf "$archive" -C "$install_dir"
          ffmpeg_bin="$(find "$install_dir" -type f -name ffmpeg -print -quit)"
          ffprobe_bin="$(find "$install_dir" -type f -name ffprobe -print -quit)"
          test -n "$ffmpeg_bin"
          test -n "$ffprobe_bin"
          sudo install -m 0755 "$ffmpeg_bin" /usr/local/bin/ffmpeg
          sudo install -m 0755 "$ffprobe_bin" /usr/local/bin/ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Download Chewy font
        run: |
          mkdir -p ~/.local/share/fonts
          curl --fail --location --silent --show-error \
            --retry 3 --connect-timeout 10 --max-time 45 \
            -o ~/.local/share/fonts/Chewy-Regular.ttf \
            https://github.com/google/fonts/raw/main/apache/chewy/Chewy-Regular.ttf

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore pipeline state (avoids repeating topics)
        uses: actions/cache@v4
        with:
          path: state
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-

      - name: Restore YouTube token (Cosmic Curious)
        env:
          TOKEN_COSMIC_CURIOUS: ${{ secrets.YOUTUBE_TOKEN_COSMIC_CURIOUS }}
        run: |
          mkdir -p tokens
          echo "$TOKEN_COSMIC_CURIOUS" | base64 -d > tokens/cosmic_curious_token.pickle

      - name: Restore YouTube Analytics token (Cosmic Curious)
        env:
          ANALYTICS_TOKEN_COSMIC_CURIOUS: ${{ secrets.YOUTUBE_ANALYTICS_TOKEN_COSMIC_CURIOUS }}
        run: |
          mkdir -p tokens
          echo "$ANALYTICS_TOKEN_COSMIC_CURIOUS" | base64 -d > tokens/analytics_token.pickle

      - name: Restore YouTube read-only token (Cosmic Curious)
        env:
          READONLY_TOKEN_COSMIC_CURIOUS: ${{ secrets.YOUTUBE_READONLY_TOKEN_COSMIC_CURIOUS }}
        run: |
          mkdir -p tokens
          if [ -n "$READONLY_TOKEN_COSMIC_CURIOUS" ]; then
            echo "$READONLY_TOKEN_COSMIC_CURIOUS" | base64 -d > tokens/youtube_readonly_token.pickle
            echo "YouTube read-only token restored."
          else
            echo "WARNING: YOUTUBE_READONLY_TOKEN_COSMIC_CURIOUS is missing; Winner Hunter will use pipeline registry only."
          fi

      - name: Manual run
        if: github.event_name == 'workflow_dispatch' && (inputs.channel != '' || inputs.force_run == true)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_ANALYTICS_TOKEN_PATH: tokens/analytics_token.pickle
          YOUTUBE_READONLY_TOKEN_PATH: tokens/youtube_readonly_token.pickle
        run: |
          channel="${{ inputs.channel || 'cosmic_curious' }}"
          python -m src.main "$channel" \
            --short \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Scheduler run
        if: github.event_name == 'workflow_dispatch' && inputs.channel == '' && inputs.force_run != true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ENABLED_CHANNELS: "cosmic_curious"
          YOUTUBE_ANALYTICS_TOKEN_PATH: tokens/analytics_token.pickle
          YOUTUBE_READONLY_TOKEN_PATH: tokens/youtube_readonly_token.pickle
        run: |
          python -m src.scheduler

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: pipeline-state-${{ github.run_id }}
