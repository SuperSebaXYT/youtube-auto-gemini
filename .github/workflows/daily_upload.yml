name: Daily Upload Pipeline

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Run a single channel manually (leave blank for scheduler)"
        required: false
      short:
        description: "Make it a short?"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (build video, skip upload)?"
        type: boolean
        default: false

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache custom fonts
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts
          key: chewy-font-v1

      - name: Install only missing system tools and fonts
        run: |
          PACKAGES=()

          if ! command -v ffmpeg >/dev/null 2>&1; then
            PACKAGES+=(ffmpeg)
          fi

          if ! dpkg-query -W -f='${Status}' fonts-freefont-ttf 2>/dev/null | grep -q "install ok installed"; then
            PACKAGES+=(fonts-freefont-ttf)
          fi

          if [ "${#PACKAGES[@]}" -gt 0 ]; then
            sudo apt-get install -y --no-install-recommends "${PACKAGES[@]}"
          fi

          mkdir -p "$HOME/.local/share/fonts"
          if ! find "$HOME/.local/share/fonts" -iname 'Chewy-Regular.ttf' -print -quit | grep -q .; then
            curl -fsSL \
              https://raw.githubusercontent.com/google/fonts/main/apache/chewy/Chewy-Regular.ttf \
              -o "$HOME/.local/share/fonts/Chewy-Regular.ttf"
            fc-cache -f "$HOME/.local/share/fonts"
          fi

          echo "ffmpeg: $(ffmpeg -version | head -n 1)"
          echo "Chewy font:"
          fc-match Chewy
          echo "FreeSans font:"
          fc-match FreeSans

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore pipeline state (avoids repeating topics)
        uses: actions/cache@v4
        with:
          path: state
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-

      - name: Restore YouTube token (Cosmic Curious)
        env:
          TOKEN_COSMIC_CURIOUS: ${{ secrets.YOUTUBE_TOKEN_COSMIC_CURIOUS }}
        run: |
          mkdir -p tokens
          echo "$TOKEN_COSMIC_CURIOUS" | base64 -d > tokens/cosmic_curious_token.pickle

      - name: Restore YouTube Analytics token (Cosmic Curious)
        env:
          ANALYTICS_TOKEN_COSMIC_CURIOUS: ${{ secrets.YOUTUBE_ANALYTICS_TOKEN_COSMIC_CURIOUS }}
        run: |
          mkdir -p tokens
          echo "$ANALYTICS_TOKEN_COSMIC_CURIOUS" | base64 -d > tokens/analytics_token.pickle

      - name: Manual run
        if: github.event_name == 'workflow_dispatch' && inputs.channel != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_ANALYTICS_TOKEN_PATH: tokens/analytics_token.pickle
        run: |
          python -m src.main "${{ inputs.channel }}" \
            ${{ inputs.short == true && '--short' || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Scheduled run
        if: github.event_name == 'workflow_dispatch' && inputs.channel == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ENABLED_CHANNELS: "cosmic_curious"
          YOUTUBE_ANALYTICS_TOKEN_PATH: tokens/analytics_token.pickle
        run: |
          python -m src.scheduler

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: pipeline-state-${{ github.run_id }}
