name: Daily Upload Pipeline

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:
    inputs:
      channel:
        description: "Run a single channel manually (leave blank for scheduler)"
        required: false
      short:
        description: "Make it a short?"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (build video, skip upload)?"
        type: boolean
        default: false

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-freefont-ttf

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore pipeline state
        uses: actions/cache@v4
        with:
          path: state
          key: pipeline-state-${{ github.run_id }}
          restore-keys: |
            pipeline-state-

      - name: Restore YouTube token (Cosmic Curious)
        env:
          TOKEN_COSMIC_CURIOUS: ${{ secrets.YOUTUBE_TOKEN_COSMIC_CURIOUS }}
        run: |
          mkdir -p tokens
          echo "$TOKEN_COSMIC_CURIOUS" | base64 -d > tokens/cosmic_curious_token.pickle

      - name: Restore YouTube Analytics token (Cosmic Curious)
        env:
          TOKEN_ANALYTICS_COSMIC_CURIOUS: ${{ secrets.YOUTUBE_ANALYTICS_TOKEN_COSMIC_CURIOUS }}
        run: |
          mkdir -p tokens
          echo "$TOKEN_ANALYTICS_COSMIC_CURIOUS" | base64 -d > tokens/analytics_token.pickle

      - name: Manual run
        if: github.event_name == 'workflow_dispatch' && inputs.channel != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_ANALYTICS_TOKEN_PATH: tokens/analytics_token.pickle
        run: |
          python -m src.main "${{ inputs.channel }}" \
            ${{ inputs.short == 'true' && '--short' || '' }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Scheduled run
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel == '')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ENABLED_CHANNELS: "cosmic_curious"
          YOUTUBE_ANALYTICS_TOKEN_PATH: tokens/analytics_token.pickle
        run: |
          python -m src.scheduler

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: pipeline-state-${{ github.run_id }}
