name: FreeInference Models Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-models:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAI client
        run: python -m pip install --disable-pip-version-check openai

      - name: List models every 5 seconds
        env:
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_API_KEY }}
          FREEINFERENCE_BASE_URL: https://freeinference.org/v1
        run: |
          python - <<'PY'
          import os
          import time
          from openai import OpenAI

          key = os.environ.get("FREEINFERENCE_API_KEY", "").strip()
          if not key:
              raise SystemExit("FREEINFERENCE_API_KEY GitHub secret is missing.")

          client = OpenAI(
              api_key=key,
              base_url=os.environ["FREEINFERENCE_BASE_URL"],
              timeout=25.0,
              max_retries=0,
          )

          for attempt in range(1, 13):
              print(f"\\n========== CHECK {attempt}/12 ==========", flush=True)
              try:
                  models = client.models.list().data
                  ids = sorted({model.id for model in models}, key=str.lower)
                  print(f"Models returned: {len(ids)}", flush=True)
                  for model_id in ids:
                      print(model_id, flush=True)

                  for target in ("deepseek-v4-flash", "qwen3.6-35b"):
                      status = "FOUND" if target in ids else "NOT FOUND"
                      print(f"{target}: {status}", flush=True)

                  if "qwen3.6-35b" in ids:
                      print("Qwen is present in the model list.", flush=True)
                      break
              except Exception as exc:
                  print(f"API check failed: {type(exc).__name__}: {exc}", flush=True)

              if attempt < 12:
                  time.sleep(5)
          PY
