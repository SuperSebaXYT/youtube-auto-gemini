name: FreeInference Full Catalog Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client
        run: python -m pip install --disable-pip-version-check openai

      - name: Compare public catalog with this API key
        env:
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_API_KEY }}
          FREEINFERENCE_BASE_URL: https://freeinference.org/v1
        run: |
          python - <<'PY'
          import os
          from openai import OpenAI

          # Public catalog from https://doc.freeinference.org/models
          # Includes documented Free, Pro, and embedding models.
          catalog = [
              ("glm-5.3-flash", "FREE", "text + image"),
              ("deepseek-v4-flash", "FREE", "text"),
              ("minimax-m3", "FREE", "text + image + video"),
              ("qwen3.6-35b", "FREE", "text + image + video"),
              ("glm-5.2", "PRO", "text"),
              ("kimi-k2.7-code", "PRO", "text + image + video"),
              ("bge-m3", "FREE", "embeddings only"),
          ]

          key = os.environ.get("FREEINFERENCE_API_KEY", "").strip()
          if not key:
              raise SystemExit("FREEINFERENCE_API_KEY GitHub secret is missing.")

          client = OpenAI(
              api_key=key,
              base_url=os.environ["FREEINFERENCE_BASE_URL"],
              timeout=30.0,
              max_retries=0,
          )

          # This endpoint is intentionally queried once. It returns models
          # visible to this key, not the complete public/Pro catalog.
          visible_ids = {m.id for m in client.models.list().data}

          print("=== FREEINFERENCE DOCUMENTED PUBLIC CATALOG ===", flush=True)
          print(f"Documented models: {len(catalog)}", flush=True)
          print("MODEL | TIER | MODALITY | THIS KEY", flush=True)
          for model_id, tier, modality in catalog:
              access = "AVAILABLE" if model_id in visible_ids else "NOT EXPOSED TO THIS KEY"
              print(f"{model_id} | {tier} | {modality} | {access}", flush=True)

          print("\\n=== COMPLETE API LIST FOR THIS KEY ===", flush=True)
          print(f"Models returned by /v1/models: {len(visible_ids)}", flush=True)
          for model_id in sorted(visible_ids, key=str.lower):
              print(model_id, flush=True)

          documented_ids = {row[0] for row in catalog}
          extra_ids = sorted(visible_ids - documented_ids, key=str.lower)
          if extra_ids:
              print("\\n=== API MODELS NOT IN THE DOCUMENTED SNAPSHOT ===", flush=True)
              for model_id in extra_ids:
                  print(model_id, flush=True)

          print("\\nNOTE: Pro models are listed from the public documentation. "
                "They will show AVAILABLE only if this API key has Pro access.", flush=True)
          PY
