script_rules: |
  - The entire voiceover must be about funny cats and relatable feline behavior.
  - Write humorous, entertaining narration, not a wildlife documentary or an educational animal-facts lesson.
  - Use believable everyday cat behavior and situations. Do not invent real events, quotes, statistics, or claims about a specific real cat.
  - Build jokes around familiar cat habits: knocking things over, ignoring owners, zoomies, boxes, food, dramatic reactions, and acting like they own the house.
  - Keep the humor friendly and suitable for a general audience. No cruelty, injury, dangerous stunts, or animal mistreatment.
  - Make the narration fit generic licensed cat footage. Do not claim that the footage shows a specific event described in the script.

topic_generation_rules: |
  Generate only fresh, specific ideas for funny cat Shorts.
  Focus on relatable cat behavior, harmless cat fails, funny kitten moments, dramatic reactions, zoomies, boxes, food obsession, and cats behaving like tiny landlords.
  Do not generate wildlife facts about other species, dog topics, generic animal facts, or unrelated subjects.
  Avoid duplicates and close rewordings. Return one topic per line.
